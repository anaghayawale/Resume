<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Anagha Yawale — Resume</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Georgia, 'Times New Roman', Times, serif, sans-serif;
      background: #ffffff;
      color: #000;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
    }

    #pdf-view {
      width: 100vw;
      height: 100vh;
      border: none;
      display: none;
    }

    #fallback {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      height: 100vh;
      font-size: 20px;
      line-height: 1.6;
    }

    a {
      color: #000;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <object id="pdf-view" data="resume.pdf" type="application/pdf"></object>

  <div id="fallback">
    <div class="contact" style="font-family: 'Times New Roman', serif; text-align: center;">
      <strong style="font-size: 25px;">Anagha Yawale</strong><br>
      <a href="mailto:anaghayawale7@gmail.com" style="font-size: 20px;">anaghayawale7@gmail.com</a><br>
      <a href="tel:+918390319324" style="font-size: 20px;">+91 8390319324</a>
    </div>

    <br/>
    <div style="font-size: 18px; font-family: 'Times New Roman', serif; text-align: center;">
      Unable to display resume. 
      <a href="resume.pdf" download style="color: #007BFF; text-decoration: underline;">Download</a> instead.
    </div>
  </div>

  <script>
    const pdf = document.getElementById("pdf-view");
    const fallback = document.getElementById("fallback");

    fetch("resumee.pdf")
      .then(res => {
        if (res.ok) {
          pdf.style.display = "block";
          fallback.style.display = "none";
        } else {
          pdf.style.display = "none";
          fallback.style.display = "flex";
        }
      })
      .catch(() => {
        pdf.style.display = "none";
        fallback.style.display = "flex";
      });
  </script>

</body>
</html>
